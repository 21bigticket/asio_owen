# ============================================================================
# 3. 配置中心同步（本地专属，不参与 Redis 托管）
# ============================================================================
# 交付默认开启：Redis 无 version 时首个 Pod 用本地托管配置播种 v1；已有
# version 时启动前拉取。单 Pod 验收后保持本文件不变，只调整副本数。
[config_sync]
enabled = true
sync_interval_sec = 5
machine_name =
first_pull = blocking
first_pull_timeout_ms = 3000

# 历史读取器自身参数（本地专属，不能被保存或回滚的配置反向修改）
[config_history]
read_mode = required
# 首次升级遇到旧 version/files 且 history 命名空间完全为空时，原子回填当前
# 版本；不会覆盖任何已有 history，回填后继续按 required 模式严格校验。
auto_migrate_legacy = true
retention_versions = 100
retention_days = 90
warn_snapshot_bytes = 262144
max_snapshot_bytes = 524288
warn_file_bytes = 65536
max_file_bytes = 131072
warn_files = 80
max_files = 100
max_reason_bytes = 512
history_page_size = 20
history_page_size_max = 50
max_diff_response_bytes = 2097152
gc_batch_size = 20
gc_interval_sec = 300

# admin 面独立信任域（本地专属，不参与 Redis 托管）
# 账号格式：username = pbkdf2_sha256$<iterations>$<salt_b64url>$<hash_b64url>
[admin]
admin = pbkdf2_sha256$100000$YXNpb19vd2VuX2FkbWlu$FQidl7NTJAglmXo5_SZL7LC2T_ikCZhweAE8Wg6FIPI
jwt_private_key = jwt_keys/admin-private-key.pem
jwt_public_key = jwt_keys/admin-public-key.pem
token_ttl_min = 120
insecure_no_auth = false

# /admin HTML 页和 /api/admin/ API 前缀本地放行；
# admin API 由 handler 使用 admin token 独立认证，不再复用业务 JWT。
[auth_whitelist]
path = /admin
path = /admin/
path = /api/admin/
