name: Service fault matrix

on:
  pull_request:
  push:
    branches: [master]

jobs:
  redis-fault-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libhiredis-dev libmysqlclient-dev pkg-config
      - name: Build server
        run: cmake -B build-integration -S . -DBUILD_TESTING=OFF && cmake --build build-integration --target server -j2
      - name: Run Redis primitive fault checks
        run: bash tests/redis_fault_matrix.sh
      - name: Run application MySQL/Redis fault and recovery checks
        run: bash tests/service_integration.sh build-integration/server
