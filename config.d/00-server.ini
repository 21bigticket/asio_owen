# ============================================================================
# 1. 基础服务 — 端口 / 日志（重启生效）
# ============================================================================
[server]
port = 8081
# 0 = auto-detect, capped at 16 to avoid inheriting an oversized host CPU count.
io_threads = 0
max_client_connections = 8192
# Covers listener/event backend, logs, config/admin file work, DNS and transient FDs.
fd_reserve = 256
log_level = INFO
log_file = server.log
downstream_write_timeout_ms = 30000
client_header_read_timeout_ms = 10000
combo_deadline_ms = 500
combo_max_in_flight_queries = 8
