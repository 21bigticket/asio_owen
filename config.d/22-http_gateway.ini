# ============================================================================
# 5. 网关行为 — 响应变换开关（定时器热加载；仅翻开关不重建上游连接池）
# ============================================================================
# 上游 JSON 响应 key 蛇形转驼峰（仅网关代理路径 /{service}/...，
# 仅 Content-Type 含 application/json 的响应；/api/* 本地路由不受影响）
#
# 取值: true/false/1/0/yes/no/on/off（不区分大小写）
# 缺省 = true（不写此 key 时保持原有转换行为）
# 注意: 非法取值会拒绝整次热加载（fail-closed），启动时则直接报错退出
# ============================================================================
[gateway]
json_keys_snake_to_camel = true
