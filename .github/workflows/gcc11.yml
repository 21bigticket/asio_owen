name: GCC 11 compatibility

on:
  pull_request:
  push:
    branches: [master]

jobs:
  gcc11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11 libhiredis-dev libmysqlclient-dev pkg-config
      - name: Configure
        env:
          CC: gcc-11
          CXX: g++-11
        run: cmake -B build-gcc11 -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-gcc11 -j 2
      - name: Test
        run: ctest --test-dir build-gcc11 --output-on-failure
